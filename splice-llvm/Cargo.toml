[package]
name = "splice-llvm"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fexolm/lancy3"
description = "LLVM ORC JIT code generator for Splice kernels"

[dependencies]
tracing.workspace = true
splice-core = { path = "../splice-core", version = "0.1.0" }
splice-target = { path = "../splice-target", version = "0.1.0" }
splice-jit = { path = "../splice-jit", version = "0.1.0" }
thiserror = "2"

[target.'cfg(windows)'.dependencies]
inkwell = { version = "0.11", default-features = false, features = ["target-x86", "llvm19-1-no-llvm-linking"] }
# The Windows build supplies the inline llvm-c/Target.h wrappers with the import library.
llvm-sys = { version = "191", features = ["disable-alltargets-init", "no-llvm-linking"] }

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
inkwell = { version = "0.11", default-features = false, features = ["target-x86", "llvm19-1-prefer-dynamic"] }

[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies]
inkwell = { version = "0.11", default-features = false, features = ["target-aarch64", "llvm19-1-prefer-dynamic"] }

[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dev-dependencies]
libc = "0.2"

[build-dependencies]
cc = "1"
