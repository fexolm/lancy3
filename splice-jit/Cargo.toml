[package]
name = "splice-jit"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fexolm/lancy3"
description = "Native debug symbol registration for the Splice JIT backends"
# The GDB JIT interface is one process-wide list: Cargo rejects a graph with
# two versions of this crate.
links = "splice_jit_gdb"
build = "build.rs"

[dependencies]
gimli = { version = "0.33", default-features = false, features = ["write", "std"] }
splice = { package = "splice-core", path = "../splice-core", version = "0.1.0" }
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
