[package]
name = "splice-jit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Native debug symbol registration for the Splice JIT backends"
readme = "../README.md"
keywords = ["jit","gdb","perf","debuginfo"]
categories = ["development-tools::debugging"]
# The GDB JIT interface is one process-wide list: Cargo rejects a graph with
# two versions of this crate.
links = "splice_jit_gdb"
build = "build.rs"

[dependencies]
gimli = { version = "0.33", default-features = false, features = ["write", "std"] }
splice-core.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

[dev-dependencies]
gimli = { version = "0.33", default-features = false, features = ["read", "write", "std"] }
object = { version = "0.37", default-features = false, features = ["read_core", "elf", "std"] }

[lints]
workspace = true
