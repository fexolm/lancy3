[package]
name = "lancy"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "A CPU JIT with SSA HIR and x86-64 and AArch64 code generation"

[features]
experimental-simd = []

[dependencies]
tracing.workspace = true
splice-target = { path = "../splice-target" }
regalloc2 = "0.15.3"
thiserror = "2"

[target.'cfg(target_arch = "x86_64")'.dependencies]
iced-x86 = { version = "1.21", default-features = false, features = ["std", "code_asm"] }

[dev-dependencies]
filecheck = "0.5"
regalloc2 = { version = "0.15.3", features = ["checker"] }

[target.'cfg(target_arch = "x86_64")'.dev-dependencies]
iced-x86 = { version = "1.21", default-features = false, features = ["decoder", "intel", "instr_info"] }
