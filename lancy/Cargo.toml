[package]
name = "lancy"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fexolm/lancy3"
description = "A CPU JIT with SSA HIR and x86-64 and AArch64 code generation"

[features]
experimental-simd = []

[dependencies]
tracing.workspace = true
splice-target = { path = "../splice-target", version = "0.1.0" }
regalloc2 = "0.15.3"
thiserror = "2"
# Both backends build on every host; only executing code needs a match.
iced-x86 = { version = "1.21", default-features = false, features = ["std", "code_asm"] }

[dev-dependencies]
filecheck = "0.5"
regalloc2 = { version = "0.15.3", features = ["checker"] }
iced-x86 = { version = "1.21", default-features = false, features = ["decoder", "intel", "instr_info"] }
