[package]
name = "splice"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "A staged Rust kernel language with a portable code generation interface"

[dependencies]
splice-macros = { path = "../splice-macros" }

[dev-dependencies]
splice-lancy = { path = "../splice-lancy" }
splice-llvm = { path = "../splice-llvm" }
splice-text = { path = "../splice-text" }

[[bench]]
name = "backends"
harness = false

[[example]]
name = "sql_plan"
test = true
