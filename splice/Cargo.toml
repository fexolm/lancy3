[package]
name = "splice-kernel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A staged Rust kernel language with a portable code generation interface"
readme = "../README.md"
keywords = ["jit","kernel","simd","codegen","staging"]
categories = ["compilers","development-tools"]

[package.metadata.docs.rs]
features = ["lancy", "cranelift"]

[lib]
name = "splice"

[features]
default = ["lancy"]
lancy = ["dep:splice-lancy"]
cranelift = ["dep:splice-cranelift"]
llvm = ["dep:splice-llvm"]

[dependencies]
splice-core.workspace = true
splice-lancy = { workspace = true, optional = true }
splice-cranelift = { workspace = true, optional = true }
splice-llvm = { workspace = true, optional = true }
[dev-dependencies]
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry", "std"] }
criterion = { version = "0.8", features = ["html_reports"] }
splice-test-traits = { path = "../tests/fixtures/trait-provider" }
splice-test-overflow = { path = "../tests/fixtures/overflow-provider" }
splice-testkit = { path = "../splice-testkit", default-features = false }
trybuild = "1"

[[bench]]
name = "backends"
harness = false
required-features = ["llvm"]

[[example]]
name = "sql_plan"
test = true

[[example]]
name = "schema_plan"
test = true

[[example]]
name = "simd_matmul"
test = true

[[example]]
name = "simd_hash_lookup"
test = true

[lints]
workspace = true
