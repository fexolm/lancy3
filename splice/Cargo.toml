[package]
name = "splice"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "A staged Rust kernel language with a portable code generation interface"

[dependencies]
tracing.workspace = true
splice-target = { path = "../splice-target" }
splice-macros = { path = "../splice-macros" }

[dev-dependencies]
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
criterion = { version = "0.8", features = ["html_reports"] }
splice-cranelift = { path = "../splice-cranelift" }
splice-lancy = { path = "../splice-lancy" }
splice-llvm = { path = "../splice-llvm" }
splice-test-traits = { path = "../tests/fixtures/trait-provider" }
splice-text = { path = "../splice-text" }

[[bench]]
name = "backends"
harness = false

[[example]]
name = "sql_plan"
test = true

[[example]]
name = "schema_plan"
test = true

[[example]]
name = "simd_matmul"
test = true

[[example]]
name = "simd_hash_lookup"
test = true
