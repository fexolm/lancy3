[package]
name = "splice-kernel"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fexolm/lancy3"
description = "A staged Rust kernel language with a portable code generation interface"

[lib]
name = "splice"

[features]
default = ["lancy"]
lancy = ["dep:splice-lancy"]
cranelift = ["dep:splice-cranelift"]
llvm = ["dep:splice-llvm"]

[dependencies]
splice-core = { path = "../splice-core", version = "0.1.0" }
splice-lancy = { path = "../splice-lancy", version = "0.1.0", optional = true }
splice-cranelift = { path = "../splice-cranelift", version = "0.1.0", optional = true }
splice-llvm = { path = "../splice-llvm", version = "0.1.0", optional = true }
[dev-dependencies]
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry", "std"] }
criterion = { version = "0.8", features = ["html_reports"] }
splice-test-traits = { path = "../tests/fixtures/trait-provider" }
splice-test-overflow = { path = "../tests/fixtures/overflow-provider" }
splice-testkit = { path = "../splice-testkit", default-features = false }
trybuild = "1"

[[bench]]
name = "backends"
harness = false
required-features = ["llvm"]

[[example]]
name = "sql_plan"
test = true

[[example]]
name = "schema_plan"
test = true

[[example]]
name = "simd_matmul"
test = true

[[example]]
name = "simd_hash_lookup"
test = true
