[workspace]
members = ["lancy", "splice", "splice-core", "splice-macros", "splice-target", "splice-lancy", "splice-llvm", "splice-cranelift", "splice-jit", "splice-testkit", "xtask"]
exclude = ["tests/fixtures/trait-provider", "tests/fixtures/overflow-provider"]
resolver = "3"

[workspace.dependencies]
tracing = { version = "0.1", default-features = false, features = ["std"] }

# The overflow fixture checks overflow opposite to its profile's
# debug_assertions, so kernels cannot follow `cfg!(debug_assertions)`.
[profile.dev.package.splice-test-overflow]
overflow-checks = false

[profile.release.package.splice-test-overflow]
overflow-checks = true
