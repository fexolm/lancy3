[workspace]
members = ["lancy", "splice", "splice-core", "splice-macros", "splice-target", "splice-lancy", "splice-llvm", "splice-cranelift", "splice-jit", "splice-testkit", "xtask"]
exclude = ["tests/fixtures/provider"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fexolm/lancy3"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[workspace.dependencies]
lancy = { path = "lancy", version = "0.1.0" }
splice-core = { path = "splice-core", version = "0.1.0" }
splice-macros = { path = "splice-macros", version = "0.1.0" }
splice-target = { path = "splice-target", version = "0.1.0" }
splice-lancy = { path = "splice-lancy", version = "0.1.0" }
splice-llvm = { path = "splice-llvm", version = "0.1.0" }
splice-cranelift = { path = "splice-cranelift", version = "0.1.0" }
splice-jit = { path = "splice-jit", version = "0.1.0" }
thiserror = "2"
libc = "0.2"
tracing = { version = "0.1", default-features = false, features = ["std"] }

# The fixture crate checks overflow opposite to its profile's
# debug_assertions, so kernels cannot follow `cfg!(debug_assertions)`.
[profile.dev.package.splice-test-fixtures]
overflow-checks = false

[profile.release.package.splice-test-fixtures]
overflow-checks = true
