[package]
name = "splice-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Procedural macros for the Splice kernel language"
readme = "../README.md"
keywords = ["jit","kernel","proc-macro"]
categories = ["compilers","development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
splice-core.workspace = true
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "visit", "visit-mut"] }

[lints]
workspace = true
